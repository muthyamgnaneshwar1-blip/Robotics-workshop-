 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Robotics Workshop 2026 | GIOE College</title>

<meta name="description"
content="Robotics Workshop 2026 for Diploma C26 First Year Students at GIOE College, East Marredpally.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#05080f;
    color:#f4f8ff;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(0,200,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,200,255,.035) 1px,transparent 1px);
    background-size:40px 40px;
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    top:-200px;
    right:-180px;
    background:rgba(0,210,255,.12);
    filter:blur(100px);
    border-radius:50%;
    z-index:-1;
}

.navbar{
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(18px);
    background:rgba(5,8,15,.78);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav-inner{
    width:92%;
    max-width:1100px;
    margin:auto;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
    letter-spacing:.5px;
}

.logo-icon{
    width:38px;
    height:38px;
    border:1px solid #25d9ff;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,210,255,.08);
    font-size:20px;
}

.logo span{
    color:#55ddff;
}

.nav-btn{
    text-decoration:none;
    color:#061018;
    background:#53dcff;
    padding:10px 17px;
    border-radius:9px;
    font-size:14px;
    font-weight:bold;
}

.hero{
    min-height:680px;
    display:flex;
    align-items:center;
    padding:70px 0;
    position:relative;
}

.hero-container{
    width:92%;
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:1.25fr .75fr;
    gap:50px;
    align-items:center;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border-radius:30px;
    border:1px solid rgba(80,220,255,.3);
    background:rgba(0,210,255,.07);
    color:#63ddff;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;
}

.status-dot{
    width:7px;
    height:7px;
    background:#45f3a1;
    border-radius:50%;
    box-shadow:0 0 12px #45f3a1;
}

.hero h1{
    margin-top:20px;
    font-size:clamp(42px,7vw,76px);
    line-height:.98;
    letter-spacing:-3px;
}

.hero h1 span{
    color:#55ddff;
}

.hero-text{
    max-width:650px;
    margin-top:22px;
    color:#9da9bd;
    font-size:18px;
    line-height:1.7;
}

.hero-actions{
    display:flex;
    gap:12px;
    margin-top:30px;
    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
    text-decoration:none;
    padding:15px 22px;
    border-radius:10px;
    font-weight:bold;
}

.primary-btn{
    color:#031018;
    background:#55ddff;
    box-shadow:0 0 30px rgba(85,221,255,.15);
}

.secondary-btn{
    color:white;
    border:1px solid #34445d;
    background:#0b111d;
}

.hero-info{
    margin-top:32px;
    display:flex;
    gap:25px;
    flex-wrap:wrap;
}

.hero-info-item small{
    display:block;
    color:#65748d;
    margin-bottom:5px;
}

.hero-info-item strong{
    font-size:15px;
}

.robot-panel{
    min-height:390px;
    border:1px solid #26344a;
    background:
        radial-gradient(circle at center,rgba(0,220,255,.12),transparent 50%),
        rgba(9,15,27,.8);
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    box-shadow:0 20px 70px rgba(0,0,0,.3);
}

.robot-panel::before{
    content:"";
    position:absolute;
    width:240px;
    height:240px;
    border:1px dashed rgba(80,220,255,.25);
    border-radius:50%;
}

.robot-panel::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border:1px solid rgba(80,220,255,.08);
    border-radius:50%;
}

.robot{
    font-size:130px;
    filter:drop-shadow(0 0 25px rgba(75,220,255,.45));
    z-index:2;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

.container{
    width:92%;
    max-width:1100px;
    margin:auto;
}

.section{
    padding:45px 0;
}

.section-heading{
    margin-bottom:25px;
}

.section-heading .mini{
    color:#55ddff;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
}

.section-heading h2{
    font-size:32px;
    margin-top:7px;
}

.section-heading p{
    color:#8997ad;
    margin-top:9px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.info-card{
    padding:23px;
    background:linear-gradient(145deg,#0d1524,#090f1b);
    border:1px solid #233149;
    border-radius:17px;
}

.info-icon{
    font-size:25px;
}

.info-card h3{
    margin-top:15px;
    font-size:17px;
}

.info-card p{
    color:#8492a8;
    margin-top:6px;
    line-height:1.5;
}

.registration-section{
    padding:70px 0;
}

.registration-layout{
    display:grid;
    grid-template-columns:.85fr 1.15fr;
    gap:20px;
    align-items:start;
}

.payment-card{
    background:linear-gradient(145deg,#0c1725,#080e18);
    border:1px solid #26364d;
    border-radius:20px;
    padding:25px;
    position:sticky;
    top:90px;
}

.payment-card h2{
    font-size:22px;
}

.payment-sub{
    color:#8997aa;
    margin-top:8px;
    line-height:1.5;
}

.price{
    font-size:45px;
    font-weight:bold;
    color:#55ddff;
    margin:20px 0;
}

.qr-wrap{
    background:white;
    padding:10px;
    border-radius:14px;
    width:max-content;
    max-width:100%;
    margin:auto;
}

.qr{
    width:230px;
    max-width:100%;
    display:block;
}

.payment-note{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#0a111e;
    border:1px solid #223149;
    color:#9aa7bb;
    line-height:1.6;
    font-size:14px;
}

.form-card{
    background:linear-gradient(145deg,#0d1524,#090f1b);
    border:1px solid #26364d;
    border-radius:20px;
    padding:30px;
}

.form-card h2{
    font-size:25px;
}

.form-card > p{
    color:#8997aa;
    margin-top:7px;
}

.form-group{
    margin-top:20px;
}

label{
    display:block;
